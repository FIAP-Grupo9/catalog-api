# Valores são placeholders ${VAR}: a pipeline de deploy (.github/workflows/ci.yml)
# os substitui via envsubst a partir de GitHub Secrets antes do kubectl apply.
# Nenhum segredo real é commitado. Ver README.md > CI/CD.
apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=catalog_db;Username=catalog_user;Password=${CATALOG_DB_PASSWORD}"
  JwtSettings__Secret: "${JWT_SECRET}"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  MongoDb__ConnectionString: "mongodb://fcg_mongo:${MONGODB_ROOT_PASSWORD}@mongodb:27017"
  # Vazio no cluster local (sem seguranca no Elasticsearch). Em produção, com
  # Elastic Cloud/Amazon OpenSearch gerenciado, preencher com a API key do serviço.
  Elasticsearch__ApiKey: "${ELASTICSEARCH_APIKEY}"

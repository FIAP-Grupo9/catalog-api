apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secret
  namespace: fcg
type: Opaque
stringData:
  ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=catalog_db;Username=catalog_user;Password=catalog_pwd"
  JwtSettings__Secret: "fcg-dev-secret-change-me-minimum-32-chars"
  RabbitMq__Username: "guest"
  RabbitMq__Password: "guest"
  MongoDb__ConnectionString: "mongodb://fcg_mongo:fcg_mongo_pwd@mongodb:27017"
  # Vazio no cluster local (sem seguranca no Elasticsearch). Em produção, com
  # Elastic Cloud/Amazon OpenSearch gerenciado, preencher com a API key do serviço.
  Elasticsearch__ApiKey: ""

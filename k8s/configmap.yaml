apiVersion: v1
kind: ConfigMap
metadata:
  name: catalog-api-config
  namespace: fcg
data:
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
  JwtSettings__Issuer: "FCG.UsersAPI"
  JwtSettings__Audience: "FCG.Services"
  RabbitMq__Host: "rabbitmq"
  RabbitMq__Port: "5672"
  RabbitMq__VirtualHost: "/"
  # Popula o catalogo com alguns jogos, apenas se ele estiver vazio.
  SeedData__Enabled: "true"
  MongoDb__Database: "catalog"
  Redis__ConnectionString: "redis:6379"
  Elasticsearch__Uri: "http://elasticsearch:9200"
  Elasticsearch__IndexName: "catalog-jogos"
  Swagger__Enabled: "true"
